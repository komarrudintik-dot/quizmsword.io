<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Master Kop Surat MS Word - SMK</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-card { background: #1e293b; border-radius: 12px; padding: 30px; width: 100%; max-width: 650px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge { background: #0284c7; color: white; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .progress-bar { width: 100%; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 25px; }
        .progress-fill { height: 100%; background: #38bdf8; width: 0%; transition: width 0.3s ease; }
        .question { font-size: 18px; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: #f1f5f9; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .btn-option { background: #334155; border: 2px solid transparent; color: #e2e8f0; padding: 14px 18px; border-radius: 8px; font-size: 15px; text-align: left; cursor: pointer; transition: all 0.2s ease; }
        .btn-option:hover { background: #475569; border-color: #38bdf8; }
        .btn-next { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; width: 100%; display: none; }
        .btn-next:hover { background: #059669; }
        .score-board { text-align: center; display: none; }
        .score-num { font-size: 64px; font-weight: 800; color: #38bdf8; margin: 10px 0; }
        .btn-restart { background: #0284c7; color: white; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-restart:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- Header Kuis -->
    <div class="header">
        <span class="badge" id="category-badge">Kuis MS Word - Kop Surat</span>
        <span id="question-count" style="color: #94a3b8; font-size: 14px;">Soal 1 dari 20</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <!-- Area Pertanyaan -->
    <div id="quiz-container">
        <div class="question" id="question-text">Memuat pertanyaan...</div>
        <div class="options" id="options-container"></div>
        <button class="btn-next" id="btn-next" onclick="nextQuestion()">Soal Selanjutnya ➔</button>
    </div>

    <!-- Area Skor Akhir -->
    <div class="score-board" id="score-container">
        <h2>🎉 Kuis Selesai!</h2>
        <p style="color: #94a3b8;">Skor Akhir Anda:</p>
        <div class="score-num" id="final-score">0</div>
        <p id="feedback-text" style="font-size: 16px; margin-bottom: 25px;"></p>
        <button class="btn-restart" onclick="restartQuiz()">🔄 Ulangi Kuis</button>
    </div>
</div>

<script>
const quizData = [
    { q: "Ikon/Logo di bawah tab Insert yang paling tepat digunakan untuk menyisipkan gambar logo instansi ke dalam kop surat adalah...", options: ["A. Shapes", "B. Pictures", "C. SmartArt", "D. Chart"], answer: 1 },
    { q: "Fitur Microsoft Word yang paling tepat digunakan untuk meletakkan kop surat agar otomatis muncul di setiap halaman atas dokumen adalah...", options: ["A. Footer", "B. Watermark", "C. Header", "D. Page Number"], answer: 2 },
    { q: "Agar logo pada kop surat dapat digeser dengan bebas tanpa merusak tata letak teks, pengaturan Text Wrapping yang paling umum digunakan adalah...", options: ["A. In Line with Text", "B. Square / In Front of Text", "C. Behind Text", "D. Top and Bottom"], answer: 1 },
    { q: "Fitur pada tab Table Design yang digunakan untuk menghilangkan garis tepi tabel (sehingga struktur kolom kop surat rapi) adalah...", options: ["A. Shading", "B. Borders ➔ No Border", "C. Table Styles", "D. Gridlines"], answer: 1 },
    { q: "Simbol ganti baris khusus yang dibuat dengan menekan tombol Shift + Enter berfungsi untuk...", options: ["A. Membuat paragraf baru dengan jarak lebar", "B. Turun ke baris baru dalam satu paragraf tanpa jarak berlebih", "C. Membuka halaman dokumen baru", "D. Menghapus teks di kanan kursor"], answer: 1 },
    { q: "Ikon ber-simbol garis horizontal bergaya tebal-tipis pada tab Home yang digunakan untuk membuat garis pembatas bawah kop surat adalah...", options: ["A. Bottom Border", "B. Horizontal Line", "C. Shape Divider", "D. Page Break"], answer: 0 },
    { q: "Untuk menyisipkan simbol telepon atau email pada teks kontak kop surat, langkah yang tepat adalah melalui menu...", options: ["A. Insert ➔ Symbol / Icons", "B. Home ➔ Paragraph", "C. Layout ➔ Margins", "D. Design ➔ Page Borders"], answer: 0 },
    { q: "Jenis huruf (Font Style) yang standar dan sering digunakan untuk penulisan nama instansi utama pada kop surat resmi adalah...", options: ["A. Comic Sans MS", "B. Times New Roman / Arial (Bold, Kapital)", "C. Brush Script MT", "D. Webdings"], answer: 1 },
    { q: "Fitur Align Center (Ctrl + E) pada toolbar Paragraph berfungsi untuk...", options: ["A. Mengatur teks rata kiri", "B. Mengatur teks rata tengah", "C. Mengatur teks rata kanan-kiri", "D. Mengatur jarak antarbaris"], answer: 1 },
    { q: "Ikon pada menu Insert yang berfungsi untuk membuat tautan alamat email atau website instansi pada kop surat menjadi aktif/dapat diklik adalah...", options: ["A. Bookmark", "B. Cross-reference", "C. Link (Hyperlink)", "D. Action Button"], answer: 2 },
    { q: "Jika Anda ingin menggabungkan dua sel tabel menjadi satu (misalnya tempat teks header di sebelah logo), fitur yang digunakan adalah...", options: ["A. Split Cells", "B. Merge Cells", "C. AutoFit", "D. Cell Margins"], answer: 1 },
    { q: "Fungsi dari fitur Crop pada tab Picture Format saat mengatur logo kop surat adalah...", options: ["A. Mengubah warna logo menjadi hitam putih", "B. Memotong bagian tepi gambar logo yang tidak diperlukan", "C. Memperbesar ukuran logo", "D. Memberikan efek bayangan"], answer: 1 },
    { q: "Simbol garis lurus mendatar yang ditarik dari menu Insert ➔ Shapes dinamakan...", options: ["A. Rectangle", "B. Line", "C. Freeform", "D. Arrow"], answer: 1 },
    { q: "Agar garis lurus dari Shapes tidak miring saat digambar di bawah kop surat, tombol keyboard yang harus ditahan adalah...", options: ["A. Ctrl", "B. Alt", "C. Shift", "D. Tab"], answer: 2 },
    { q: "Fitur Line and Paragraph Spacing berfungsi untuk...", options: ["A. Mengubah ukuran huruf", "B. Mengatur kerapatan/jarak antarbaris teks alamat dan kontak", "C. Mengatur batas tepi kertas", "D. Mengubah warna background"], answer: 1 },
    { q: "Ikon Page Setup ➔ Margins berfungsi untuk...", options: ["A. Mengatur jarak batas kertas agar kop surat muat dengan presisi", "B. Mengubah warna kertas", "C. Menyisipkan bingkai", "D. Mengatur jumlah kolom"], answer: 0 },
    { q: "Font bawaan Windows yang berisi simbol visual seperti telepon dan lokasi untuk kontak kop surat adalah...", options: ["A. Calibri", "B. Wingdings / Webdings", "C. Georgia", "D. Tahoma"], answer: 1 },
    { q: "Pilihan Different First Page pada tab Header & Footer berguna jika...", options: ["A. Kop surat hanya ingin ditampilkan di halaman pertama saja", "B. Kop surat ingin diletakkan di seluruh halaman", "C. Halaman pertama tidak diberi nomor", "D. Kop surat dibuat beda warna"], answer: 0 },
    { q: "Ikon Color / Recolor pada tab Picture Format digunakan untuk...", options: ["A. Mengubah logo berwarna menjadi transparan atau hitam-putih", "B. Mengubah format file logo", "C. Menghapus latar belakang gambar", "D. Memutar posisi logo 90 derajat"], answer: 0 },
    { q: "Tombol pintas (shortcut) keyboard untuk mengubah teks nama instansi menjadi huruf kapital semua (UPPERCASE) dengan cepat adalah...", options: ["A. Shift + F3 (atau Ctrl + Shift + A)", "B. Ctrl + B", "C. Ctrl + U", "D. Alt + F4"], answer: 0 }
];

let currentIdx = 0;
let score = 0;
let selectedOption = null;

function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById("question-count").innerText = `Soal ${currentIdx + 1} dari ${quizData.length}`;
    document.getElementById("progress").style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
    document.getElementById("question-text").innerText = `${currentIdx + 1}. ${q.q}`;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    document.getElementById("btn-next").style.display = "none";
    selectedOption = null;

    q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(idx, btnElement) {
    const allBtns = document.querySelectorAll(".btn-option");
    allBtns.forEach(b => {
        b.style.borderColor = "transparent";
        b.style.background = "#334155";
    });

    selectedOption = idx;
    btnElement.style.borderColor = "#38bdf8";
    btnElement.style.background = "#1e293b";
    document.getElementById("btn-next").style.display = "block";
}

function nextQuestion() {
    if (selectedOption === quizData[currentIdx].answer) {
        score += 5; // Total skor 100 (20 soal x 5 point)
    }

    currentIdx++;
    if (currentIdx < quizData.length) {
        loadQuestion();
    } else {
        showScore();
    }
}

function showScore() {
    document.getElementById("quiz-container").style.display = "none";
    document.getElementById("score-container").style.display = "block";
    document.getElementById("final-score").innerText = score;

    let feedback = "";
    if (score >= 85) feedback = "🥇 Luar biasa! Pemahaman Anda tentang Kop Surat MS Word sangat sempurna.";
    else if (score >= 70) feedback = "🥈 Bagus! Anda sudah menguasai sebagian besar fitur pembuatan Kop Surat.";
    else feedback = "📚 Masih perlu belajar lagi. Pelajari kembali fungsi toolbar di Microsoft Word.";
    
    document.getElementById("feedback-text").innerText = feedback;
}

function restartQuiz() {
    currentIdx = 0;
    score = 0;
    document.getElementById("quiz-container").style.display = "block";
    document.getElementById("score-container").style.display = "none";
    loadQuestion();
}

// Mulai kuis saat halaman dimuat
loadQuestion();
</script>

</body>
</html>
